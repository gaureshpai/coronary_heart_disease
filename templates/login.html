{% extends "base.html" %} {% block title %}Login - CHD Prediction{% endblock %}
{% block content %}
<div class="prediction-form" style="max-width: 400px; margin-top: 5rem;">
  <h2>Login</h2>
  {% if error %}
  <div class="error-banner">
    <p>{{ error }}</p>
  </div>
  {% endif %}
  <form method="POST" action="/login">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required />
    </div>
    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />
    </div>
    <button type="submit" class="btn-predict">Login</button>
  </form>
  <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
    Don't have an account? <a href="/signup" style="color: var(--primary-color);">Create one</a>
  </p>
</div>
{% endblock %}
