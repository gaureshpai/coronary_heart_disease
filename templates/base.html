<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Coronary Heart Disease Prediction{% endblock %}
    </title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand">
        <a href="/">CHD Predictor</a>
      </div>
      <div class="nav-links">
        <a href="/" class="{% if request.endpoint == 'home' %}active{% endif %}"
          >Home</a
        >
        <a
          href="/about"
          class="{% if request.endpoint == 'about' %}active{% endif %}"
          >About</a
        >
      </div>
    </nav>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="footer">
      <p>&copy; 2026 Coronary Heart Disease Prediction System</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
